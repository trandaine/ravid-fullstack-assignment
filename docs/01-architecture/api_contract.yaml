openapi: 3.0.3
info:
  title: RAVID Fullstack RAG Chatbot API
  version: 1.0.0
  description: |
    Retrieval-Augmented Generation (RAG) document chatbot backend. Authenticated users upload
    documents (.pdf, .txt, .md), which are asynchronously parsed, chunked, embedded, and indexed
    into a per-user isolated vector collection. Users can query their knowledge base via standard
    RAG or advanced HyDE (Hypothetical Document Embeddings) retrieval.
servers:
  - url: http://localhost:8000
    description: Local Docker Compose Environment
paths:
  /api/register/:
    post:
      summary: Register a new user account
      description: Create a new user account with email and password.
      operationId: auth_register_create
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterSuccessResponse'
        '400':
          description: Validation error or duplicate email.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/login/:
    post:
      summary: User login
      description: Authenticate user credentials and issue a JWT access token. Also supports HTTP Basic Auth for mobile credential exchange.
      operationId: auth_login_create
      tags:
        - Authentication
      security:
        - basicAuth: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful. Returns JWT access token.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400':
          description: Invalid payload or missing credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Invalid email or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/auth/me/:
    get:
      summary: Current user profile
      description: Return the authenticated user's ID and email.
      operationId: auth_me_retrieve
      tags:
        - Authentication
      security:
        - jwtAuth: []
        - basicAuth: []
      responses:
        '200':
          description: Authenticated user details.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid authentication token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/documents/upload/:
    post:
      summary: Upload a private document
      description: |
        Upload a .pdf, .txt, or .md file (max 10 MB). Stores the file, creates a Document and
        IngestionJob record, and dispatches an asynchronous background task to chunk, embed,
        and index the content into the user's isolated Chroma collection. Requires JWT authentication.
      operationId: documents_upload_create
      tags:
        - Documents
      security:
        - jwtAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadRequest'
            encoding:
              file:
                contentType: application/pdf, text/plain, text/markdown
      responses:
        '202':
          description: File accepted and background ingestion queued.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadSuccessResponse'
        '400':
          description: Bad Request (missing file field or invalid form parameters).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid JWT authentication token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden (user inactive or unauthorized).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Payload Too Large (file size exceeds 10 MB limit).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: Unsupported Media Type (only PDF, TXT, and Markdown files are allowed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests (rate limit exceeded).
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/documents/:
    get:
      summary: List user documents
      description: Return all documents owned by the authenticated user. Requires JWT authentication.
      operationId: documents_list
      tags:
        - Documents
      security:
        - jwtAuth: []
      responses:
        '200':
          description: List of documents owned by the caller.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentItem'
        '401':
          description: Missing or invalid JWT authentication token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/documents/{id}/:
    delete:
      summary: Delete a document
      description: Delete an uploaded document and its vector embeddings in Chroma. Requires JWT authentication.
      operationId: documents_delete
      tags:
        - Documents
      security:
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the document to delete
          schema:
            type: string
            format: uuid
            example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '204':
          description: Document deleted successfully.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
        '400':
          description: Invalid document UUID format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid JWT authentication token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Document not found or owned by another user.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/documents/status/:
    get:
      summary: Poll ingestion task status
      description: Retrieve the real-time status of an asynchronous document ingestion task. Requires JWT authentication.
      operationId: documents_status_retrieve
      tags:
        - Documents
      security:
        - jwtAuth: []
      parameters:
        - name: task_id
          in: query
          required: true
          description: Celery task UUID returned from the upload endpoint
          schema:
            type: string
            format: uuid
            example: c9bf9e57-1685-4c89-bafb-ff5af830be8a
      responses:
        '200':
          description: Current ingestion task state.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStatusResponse'
        '400':
          description: Missing or invalid task_id query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid JWT authentication token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Task ID not found or not owned by caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/chat/query/:
    post:
      summary: Submit RAG / HyDE chat query
      description: |
        Ask a question against the user's private knowledge base. Retrieves context from
        the user's isolated Chroma collection (`user_{user_id}`) and synthesizes an answer via
        OpenRouter LLM. Optionally supports advanced HyDE (Hypothetical Document Embeddings) retrieval
        and multi-turn conversational history.
      operationId: chat_query_create
      tags:
        - Chat
      security:
        - jwtAuth: []
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: Grounded answer from the knowledge base.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQuerySuccessResponse'
        '400':
          description: Missing query parameter or invalid payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests.
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter the JWT token returned by POST /api/login/
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Authentication using registered email and password

  headers:
    Retry-After:
      description: Recommended wait interval in seconds before the next polling request.
      schema:
        type: integer
        example: 3
    RateLimit-Limit:
      description: The maximum number of allowed requests in the current rate limit window.
      schema:
        type: integer
        example: 100
    RateLimit-Remaining:
      description: The number of remaining requests allowed in the current rate limit window.
      schema:
        type: integer
        example: 95
    RateLimit-Reset:
      description: The number of seconds remaining until the rate limit window resets.
      schema:
        type: integer
        example: 60

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePassw0rd!

    RegisterSuccessResponse:
      type: object
      required:
        - message
        - user_id
      properties:
        message:
          type: string
          example: User registered successfully
        user_id:
          type: integer
          example: 1

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: SecurePassw0rd!

    LoginSuccessResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
          example: Login successful
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    MeResponse:
      type: object
      required:
        - user_id
        - email
      properties:
        user_id:
          type: integer
          example: 1
        email:
          type: string
          example: user@example.com

    DocumentUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Uploaded file (.pdf, .txt, .md, max 10 MB)

    DocumentUploadSuccessResponse:
      type: object
      required:
        - message
        - document_id
        - task_id
      properties:
        message:
          type: string
          example: Document uploaded and ingestion started
        document_id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        task_id:
          type: string
          format: uuid
          example: c9bf9e57-1685-4c89-bafb-ff5af830be8a

    DocumentItem:
      type: object
      required:
        - id
        - original_name
        - content_type
        - size_bytes
        - uploaded_at
      properties:
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        original_name:
          type: string
          example: quarterly_report.pdf
        content_type:
          type: string
          example: application/pdf
        size_bytes:
          type: integer
          example: 204850
        uploaded_at:
          type: string
          format: date-time
          example: 2026-09-20T10:00:00Z

    IngestionStatusResponse:
      type: object
      oneOf:
        - $ref: '#/components/schemas/IngestionStatusProcessingResponse'
        - $ref: '#/components/schemas/IngestionStatusSuccessResponse'
        - $ref: '#/components/schemas/IngestionStatusFailureResponse'
      discriminator:
        propertyName: status
        mapping:
          PROCESSING: '#/components/schemas/IngestionStatusProcessingResponse'
          SUCCESS: '#/components/schemas/IngestionStatusSuccessResponse'
          FAILURE: '#/components/schemas/IngestionStatusFailureResponse'

    IngestionStatusProcessingResponse:
      type: object
      required:
        - task_id
        - status
      properties:
        task_id:
          type: string
          format: uuid
          example: c9bf9e57-1685-4c89-bafb-ff5af830be8a
        status:
          type: string
          enum: [PROCESSING]
          example: PROCESSING

    IngestionStatusSuccessResponse:
      type: object
      required:
        - task_id
        - status
        - message
      properties:
        task_id:
          type: string
          format: uuid
          example: c9bf9e57-1685-4c89-bafb-ff5af830be8a
        status:
          type: string
          enum: [SUCCESS]
          example: SUCCESS
        message:
          type: string
          example: Document successfully parsed, embedded, and indexed in vector storage.

    IngestionStatusFailureResponse:
      type: object
      required:
        - task_id
        - status
        - error
      properties:
        task_id:
          type: string
          format: uuid
          example: c9bf9e57-1685-4c89-bafb-ff5af830be8a
        status:
          type: string
          enum: [FAILURE]
          example: FAILURE
        error:
          type: string
          example: Failed to parse document content.

    ChatMessageHistory:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          example: user
        content:
          type: string
          example: What was the revenue for Q3?

    ChatQueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          example: What are the main findings in the document?
        use_hyde:
          type: boolean
          default: false
          description: Toggle advanced Hypothetical Document Embeddings (HyDE) retrieval mode
          example: true
        message_histories:
          type: array
          description: Optional list of previous chat turns for conversation context
          items:
            $ref: '#/components/schemas/ChatMessageHistory'

    ChatQuerySuccessResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          example: Based on your uploaded documents, the total revenue increased by 14% in Q3.

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
          example: https://api.ravid.cloud/errors/invalid-file-format
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Unsupported Media Type
        status:
          type: integer
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 415
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Invalid file format. Only PDF, TXT, and Markdown files are allowed.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
          example: /api/documents/upload/
        invalid_params:
          type: array
          description: Detailed validation error breakdowns for specific input parameters.
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
                example: file
              reason:
                type: string
                example: Unsupported extension .xlsx. Allowed extensions are .pdf, .txt, .md.

    ErrorEnvelope:
      $ref: '#/components/schemas/ProblemDetails'
